version: '3.9'

services:
  logto:
    # 自构建镜像（patch stack 模式，详见 ADR-013）
    # 构建：bash scripts/build-image.sh
    image: ${LOGTO_IMAGE:-winamz/logto:v1.44.0-winamz.1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:4000"
      - "3002:4001"
    environment:
      - TRUST_PROXY_HEADER=1
      - DB_URL=postgres://postgres:p0stgr3s@postgres:5432/logto
      - ENDPOINT
      - ADMIN_ENDPOINT
      - WINAMZ_SILENT_GRANT_CLIENT_IDS=winamz-launcher-spa,winamz-buyer-spa,winamz-seller-spa
      - WINAMZ_SILENT_GRANT_AUDIENCES=https://api.winamz.com
      - WINAMZ_SILENT_GRANT_ORIGINS=tauri://localhost,http://tauri.localhost,https://tauri.localhost

  postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: p0stgr3s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - logto_pg_data:/var/lib/postgresql/data

volumes:
  logto_pg_data:
